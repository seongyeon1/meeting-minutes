name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Lint
        run: uvx ruff check .
      # Tests stub out WhisperX and the LLMs, so skip the multi-GB torch install.
      - name: Test
        run: uv run --no-project --with fastapi --with httpx --with python-multipart --with pytest pytest -q
