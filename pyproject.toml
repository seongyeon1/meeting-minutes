[project]
name = "meeting-minutes"
version = "0.1.0"
description = "Local speech pipeline (ASR, word alignment, speaker diarization) for any recording, with documents from any LLM or coding agent, as web UI, CLI, skill and MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["meeting-minutes", "mcp", "agent-skill", "transcription", "whisperx", "speaker-diarization", "pyannote", "llm", "korean"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "whisperx>=3.8.6",
]

[project.scripts]
meeting-minutes = "meeting_minutes:main"
meeting-minutes-web = "meeting_minutes_web:main"
voicekit = "voicekit.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["meeting_minutes.py", "meeting_minutes_web.py", "web/index.html", "voicekit"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Optional[...] is the house style.
ignore = ["UP045"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
